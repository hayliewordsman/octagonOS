name: verify

# Everything here runs without an Android SDK checkout, a device or an
# emulator. The point is that the checks which caught real bugs in this
# repository keep running, rather than depending on someone remembering to.
#
# What CI can and cannot do is the same split as everywhere else in this
# project: it verifies, it does not prove. No image is built and nothing boots.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shaders:
    name: AGSL compiles, and the maths still agrees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # skia-python will not even import without these.
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: pip install skia-python numpy pillow
      - run: mobile/tools/validate-shaders.py

  artifacts:
    name: Boot animation and icon pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy pillow
      # Rebuild rather than trusting what is committed: a generator change that
      # nobody re-ran is exactly the drift this is for.
      - run: mobile/bootanimation/build.sh
      - run: SKIP_APK=1 mobile/iconpack/build.sh
      - name: the committed boot animation is what the generator produces
        run: git diff --exit-code --stat mobile/bootanimation/out mobile/iconpack/FacetUIIcons

  formfactor:
    name: Form-factor detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mobile/tools/test-formfactor-detect.sh

  overlays:
    name: Overlays link, and their targets have the resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # Sparse clones: only res/ is needed, and a full checkout of these is
      # gigabytes for a few hundred XML files.
      - name: Fetch the target trees
        run: |
          set -eux
          sparse() {
            git clone --quiet --depth 1 --filter=blob:none --sparse \
              -b lineage-24.0 "https://github.com/LineageOS/$1" "$2"
            git -C "$2" sparse-checkout set "${3:-res}"
          }
          sparse android_frameworks_base            ../fwb   "core/res/res packages/SystemUI/res packages/SettingsLib"
          sparse android_packages_apps_Launcher3    ../l3
          sparse android_packages_inputmethods_LatinIME ../ime  java/res
          sparse android_packages_apps_Settings     ../settings
          mkdir -p ../apps
          for a in DocumentsUI Etar DeskClock; do
            sparse "android_packages_apps_$a" "../apps/$a" "res app/src/main/res"
          done

      - name: Resource names exist in their targets
        run: |
          mobile/tools/validate-overlays.py \
            --overlay-root mobile/overlay \
            --systemui ../fwb --launcher ../l3 --ime ../ime \
            --settings ../settings --apps ../apps

      # The check above verifies names. Only a linker verifies that references
      # RESOLVE -- which is how two real bugs got in, and stayed in, until the
      # first time anyone ran aapt2.
      - name: Overlays actually link
        run: |
          set -eux
          curl -sSLo bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q bt.zip -d "$RUNNER_TEMP/bt"
          curl -sSLo plat.zip https://dl.google.com/android/repository/platform-35_r02.zip
          unzip -q plat.zip -d "$RUNNER_TEMP/plat"
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass ciciciok \
            -keyalg RSA -keysize 2048 -validity 10000 -alias ci \
            -dname "CN=octagonOS CI, O=octagonOS, C=US"
          export PATH="$RUNNER_TEMP/bt/android-14:$PATH"
          export ANDROID_JAR="$RUNNER_TEMP/plat/android-35/android.jar"
          export KEYSTORE="$RUNNER_TEMP/ci.jks" KEYSTORE_PASS=ciciciok
          mobile/overlay/build.sh
          mobile/iconpack/build.sh

  patches:
    name: Patches still apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A patch that stopped applying is the most likely way this repository
      # rots: upstream moves, and nothing here would notice.
      - name: Apply every patch to a pristine tree
        run: |
          set -eux
          clone() {
            git clone --quiet --depth 1 -b lineage-24.0 "https://github.com/LineageOS/$1" "$2"
          }
          clone android_frameworks_base ../fwb
          for p in mobile/patches/systemui/*.patch mobile/patches/framework/*.patch; do
            git -C ../fwb apply --check "$GITHUB_WORKSPACE/$p"
            git -C ../fwb apply "$GITHUB_WORKSPACE/$p"
          done
          clone android_packages_inputmethods_LatinIME ../ime
          git -C ../ime apply --check "$GITHUB_WORKSPACE/mobile/patches/ime/0001-facetui-glass-keyboard-window.patch"
          clone android_frameworks_libs_systemui ../libs
          git -C ../libs apply --check "$GITHUB_WORKSPACE/mobile/patches/iconloader/0001-facetui-icon-glass.patch"

  plymouth:
    name: The boot splash, checked and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy pillow

      # Rebuild rather than trusting what is committed, for the same reason as
      # the boot animation: a generator change nobody re-ran is the drift this
      # is for. The frame counts are prepended into the script by the
      # generator, so a stale theme is a script that disagrees with its frames.
      - run: desktop/plymouth/make-plymouth-theme.py
      - name: the committed theme is what the generator produces
        run: git diff --exit-code --stat desktop/plymouth/octagonos

      - run: desktop/tools/verify-plymouth-theme.py

      # The static checks read the script. This runs it. A Plymouth theme fails
      # silently -- a callback that never fires draws nothing and logs nothing
      # -- so the only way to know is to put it on a screen and look.
      - name: Install what a real boot would install
        run: |
          sudo apt-get update
          sudo apt-get install -y plymouth plymouth-x11 plymouth-label \
                                  xvfb xdotool netpbm x11-apps
      - name: Run it, type at it, and check each state
        run: |
          set -eux
          sudo desktop/plymouth/install.sh --no-initrd
          sudo desktop/tools/run-plymouth-theme.sh ci \
            "true" \
            "plymouth ask-for-password --prompt='Unlock disk (ci_crypt)' &" \
            KEYS:hunter2 ENTER
          desktop/tools/check-plymouth-shots.py desktop/tools/ci

  kwin-shader:
    name: The FacetUI GLSL compiles, and computes the right thing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy pillow

      # A GLES 3 driver. llvmpipe is the same Mesa shader compiler a GPU would
      # use, and the numeric check does not care how fast the pixels arrive.
      - name: A real GL driver, and the headers to talk to it
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev \
                                  libgl1-mesa-dri
      - run: desktop/tools/validate-kwin-shaders.py

      # Rendered, but NOT diffed against the committed image. The preview
      # draws text, so its pixels depend on the freetype and fontconfig on the
      # machine, and llvmpipe's on the Mesa version -- a byte comparison would
      # be green on the machine that produced it and red on this one, which is
      # a check that only ever cries wolf. What the shader COMPUTES is pinned
      # by validate-kwin-shaders.py above, against the NumPy, to 2e-4.
      # This step is here to catch the renderer crashing.
      - run: desktop/tools/render-kwin-glass.py --out /tmp/kwin-glass.png

  kwin-effect:
    name: The effect builds, and KWin accepts the plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 has no Plasma 6. KDE neon is that same Ubuntu with Plasma
      # 6 on top, which is what makes a real build possible here at all --
      # everything below this line was written against an API that could not be
      # compiled until these packages existed.
      - name: KWin 6, from KDE neon
        run: |
          set -eux
          curl -fsSL https://archive.neon.kde.org/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/neon.gpg
          echo "deb [signed-by=/usr/share/keyrings/neon.gpg] \
                http://archive.neon.kde.org/user noble main" \
            | sudo tee /etc/apt/sources.list.d/neon.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kwin-dev kwin-wayland extra-cmake-modules qt6-base-dev \
            libkf6coreaddons-dev libkf6config-dev \
            dbus-bin libgl1-mesa-dri

      # Fast, and it catches the one thing the build cannot: this also runs
      # against the KWin the effect is compiled against, so a mismatch here
      # means the two disagree about what was installed.
      - run: desktop/tools/check-kwin-api.py

      # The real thing: compile, install, start KWin, and see what it does with
      # the plugin. It reports honestly that it cannot prove the effect DRAWS
      # correctly without a GPU -- that part is settled by kwin-shader above.
      - run: desktop/tools/run-kwin-effect.sh

  plasma-style:
    name: The Plasma style, rendered by Plasma's own engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy pillow

      # KSvg is Plasma's SVG engine, and it is what renders a desktop theme.
      # Plasma::Svg moved into it for Plasma 6, so this is the library to
      # check against, not libplasma. Ubuntu 24.04 has no Plasma 6; KDE neon
      # is that same Ubuntu with Plasma 6 on top.
      - name: KSvg, from KDE neon
        run: |
          set -eux
          curl -fsSL https://archive.neon.kde.org/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/neon.gpg
          echo "deb [signed-by=/usr/share/keyrings/neon.gpg] \
                http://archive.neon.kde.org/user noble main" \
            | sudo tee /etc/apt/sources.list.d/neon.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kf6-ksvg-dev extra-cmake-modules qt6-base-dev \
            libkf6coreaddons-dev libkf6config-dev

      # Rebuild rather than trusting what is committed: a generator change
      # nobody re-ran is the drift this is for.
      - run: desktop/plasma/make-plasma-theme.py
      - name: the committed theme is what the generator produces
        run: git diff --exit-code --stat desktop/plasma/FacetUI

      - run: desktop/tools/verify-plasma-theme.py

      # The real thing: every surface painted by KSvg over black and over
      # white, and the difference measured. An opaque dark surface looks
      # exactly like a translucent one until something subtracts the two.
      - run: desktop/tools/run-plasma-theme.sh

      # Rendered but not diffed, for the reason given in the kwin-shader job:
      # the preview draws text, so its pixels depend on the fonts installed.
      - run: desktop/tools/render-plasma-surfaces.py --out /tmp/plasma.png

  icon-theme:
    name: The icon theme, resolved by Qt and validated by GTK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy pillow cairosvg

      # Qt for the resolver, a real icon theme to inherit from, and GTK's
      # cache builder, which is also its validator.
      - name: Qt, Breeze and GTK's icon tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev cmake g++ gtk-update-icon-cache breeze-icon-theme \
            hicolor-icon-theme

      # Rebuild rather than trusting what is committed.
      - run: desktop/icons/make-icon-theme.py
      - name: the committed theme is what the generator produces
        run: git diff --exit-code --stat desktop/icons/FacetUI

      - run: desktop/tools/verify-icon-theme.py

      # Every name at every size, each compared against the file the theme
      # ships. The spec says an unresolvable name falls back, so a broken
      # theme resolves everything perfectly -- to somebody else's icons.
      - run: desktop/tools/run-icon-theme.sh

      # Rendered but not diffed: the sheet draws text, so its pixels depend on
      # the fonts installed. Here to catch the renderer crashing.
      - run: desktop/tools/render-icon-sheet.py --out /tmp/icons.png

      # The tile now lives in shared/, so the Android pack renders from the
      # same code. If that extraction ever changes what it draws, the pack's
      # own reproducibility check is where it shows.
      - run: SKIP_APK=1 mobile/iconpack/build.sh
      - name: the Android icon pack still renders identically
        run: git diff --exit-code --stat mobile/iconpack/FacetUIIcons

  packaging:
    name: The packages build, and FacetUI comes out as the default
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: KWin 6 and the packaging tools, from KDE neon
        run: |
          set -eux
          curl -fsSL https://archive.neon.kde.org/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/neon.gpg
          echo "deb [signed-by=/usr/share/keyrings/neon.gpg] \
                http://archive.neon.kde.org/user noble main" \
            | sudo tee /etc/apt/sources.list.d/neon.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper fakeroot lintian dpkg-dev cmake \
            kwin-dev extra-cmake-modules qt6-base-dev \
            libkf6coreaddons-dev libkf6config-dev kf6-ksvg-dev \
            kf6-kconfig plasma-workspace plymouth \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri \
            gtk-update-icon-cache breeze-icon-theme hicolor-icon-theme
          pip install numpy pillow cairosvg

      - run: desktop/packaging/build-debs.sh

      # Packaging mistakes that reach a machine are expensive; lintian is free.
      - name: lintian
        run: |
          cd desktop/packaging/out
          lintian --tag-display-limit 0 --fail-on error,warning \
            --suppress-tags unstripped-binary-or-object,no-manual-page *.deb

      - name: install them
        run: sudo dpkg -i desktop/packaging/out/*.deb

      # THE question: installed, or actually in use? Resolved the way a Plasma
      # component resolves it, as a user with an empty home directory.
      - run: desktop/tools/check-facetui-defaults.sh

  selftest-verdict:
    name: The boot verdict says what the evidence supports
    runs-on: ubuntu-latest
    # No image and no virtual machine: this reads serial logs as text. It is
    # here because the verdict logic was wrong in the worst available way --
    # handed a boot that failed before graphics were ever checked, it reported
    # that OpenGL compositing was working and blamed FacetUI. It could say
    # that because the only way to run it was to boot a VM for half an hour,
    # so nobody ever did. Now it takes a second.
    steps:
      - uses: actions/checkout@v4
      - run: desktop/tools/test-judge-selftest.sh
