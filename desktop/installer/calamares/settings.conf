# Calamares, configured for octagonOS.
#
# Written here rather than installed from a package because no
# calamares-settings-octagonos exists -- the neon package ships the installer
# and no configuration at all, on the assumption that a distribution supplies
# its own. This is ours.
#
# The exec sequence has one ordering that is not obvious and does matter:
# shellprocess@removelive and removeuser run BEFORE users. The live image
# autologins as `octagon`, and removing that account has to happen before the
# real one is created, in case the person installing chooses the same name.
---
modules-search: [ local ]

instances:
- id: removelive
  module: shellprocess
  config: shellprocess_removelive.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - networkcfg
  - hwclock
  - shellprocess@removelive
  - removeuser
  - users
  - displaymanager
  - services-systemd
  - grubcfg
  - bootloader
  - initramfscfg
  - initramfs
  - umount
- show:
  - finished

branding: octagonos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
