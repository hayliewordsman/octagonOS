# `octagon` is forbidden as a username on purpose: it is the live session's
# account, removeuser deletes it a step earlier, and letting somebody install
# under that name would mean creating an account and then deleting it.
---
defaultGroups:
    - users
    - sudo
    - audio
    - video
    - plugdev
    - netdev
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
    nonempty: true
    minLength: 4
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root, octagon, daemon, bin, sys, nobody ]
