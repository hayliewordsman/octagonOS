# The self-test, the OpenGL override and the unattended installer are test
# scaffolding. They are inert without their kernel flags, but an installed
# machine should not carry them at all.
---
units:
    - name: octagonos-selftest.service
      action: disable
      mandatory: false
    - name: octagonos-forcegl.service
      action: disable
      mandatory: false
    - name: octagonos-autoinstall.service
      action: disable
      mandatory: false
    - name: sddm.service
      action: enable
      mandatory: false
