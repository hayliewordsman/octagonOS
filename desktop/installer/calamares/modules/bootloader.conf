# installEFIFallback writes \EFI\BOOT\BOOTX64.EFI as well as the NVRAM entry.
# Firmware that ignores NVRAM -- and any disk moved to another machine --
# boots that path or nothing.
---
efiBootLoader: "grub"
kernelParams: [ "quiet", "splash" ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
