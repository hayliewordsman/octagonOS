# Undo the live image, inside the target, before the real user is created.
#
# Everything here has an exact counterpart in octagonos-install. Two
# installers that disagree about what "installed" means is how one of them
# ships a machine that autologins to a published password.
---
dontChroot: false
timeout: 600
script:
    - "-apt-get purge -y casper"
    - "-rm -f /etc/casper.conf"
    - "-rm -f /etc/sddm.conf.d/octagonos.conf"
    - "-sed -i '/^KWIN_COMPOSE=/d; /^KWIN_DRM_NO_AMS=/d' /etc/environment"
    - "-rm -f /etc/systemd/system/octagonos-selftest.service"
    - "-rm -f /etc/systemd/system/octagonos-forcegl.service"
    - "-rm -f /etc/systemd/system/octagonos-autoinstall.service"
