# The live filesystem, copied onto the target.
#
# From the squashfs rather than from /, for the same reason the terminal
# installer does it: the live root is a union of the squashfs and everything
# this session has written since boot, and none of that belongs on a fresh
# install.
---
unpack:
    - source: "/cdrom/casper/filesystem.squashfs"
      sourcefs: "squashfs"
      destination: ""
